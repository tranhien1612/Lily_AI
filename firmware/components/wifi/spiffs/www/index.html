<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cấu hình Lily AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="card">
    <div class="header">
      <div class="logo">🤖</div>
      <h2>Lily AI - Cấu hình mạng</h2>
      <p>Kết nối thiết bị vào mạng WiFi gia đình và máy chủ AI Local</p>
    </div>

    <div class="section">
      <div class="scan-bar">
        <label>Danh sách WiFi khả dụng:</label>
        <button id="btn-scan" type="button" onclick="scanWifi()">🔄 Quét mạng</button>
      </div>
      <select id="wifi-select" onchange="onSelectWifi(this.value)">
        <option value="">-- Đang quét mạng WiFi... --</option>
      </select>
    </div>

    <form id="config-form" onsubmit="saveConfig(event)">
      <div class="field">
        <label for="ssid">Tên WiFi (SSID):</label>
        <input type="text" id="ssid" name="ssid" placeholder="Nhập hoặc chọn SSID" required>
      </div>

      <div class="field">
        <label for="password">Mật khẩu WiFi:</label>
        <input type="password" id="password" name="password" placeholder="Mật khẩu WiFi">
      </div>

      <div class="field">
        <label for="ws_url">Địa chỉ WebSocket Server:</label>
        <input type="text" id="ws_url" name="ws_url" value="ws://192.168.1.102:8000/ws" required>
        <small>Ví dụ: ws://192.168.1.102:8000/ws (IP của Raspberry Pi)</small>
      </div>

      <button type="submit" id="btn-save" class="btn-primary">💾 Lưu & Kết nối</button>
    </form>

    <div id="status" class="status-msg"></div>
  </div>
  <script src="script.js"></script>
</body>

</html>
